<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GJGRAM</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #fff;
      color: #000;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      border-bottom: 1px solid #ccc;
      font-size: xx-large;
    }

    .navbar-icons {
      display: flex;
      align-items: center;
    }

    .navbar-icons i {
      margin-left: 15px;
      font-size: 50px;
    }

    .menu-bar {
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-bottom: 1px solid #ccc;
    }

    .menu-bar i {
      font-size: 22px;
    }

    .menu-bar i.active {
      color: red;
    }

    .post {
      padding: 15px;
      border-bottom: 1px solid #ccc;
    }

    .post-header {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }

    .profile-pic {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #ccc;
      margin-right: 10px;
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }

    .user-info .name {
      font-weight: bold;
    }

    .user-info .stats {
      font-size: 12px;
    }

    .user-info .stats span {
      margin-right: 10px;
    }

    .post img {
      width: 100%;
      border-radius: 8px;
      margin-top: 10px;
    }

    .post-actions {
      display: flex;
      justify-content: start;
      gap: 20px;
      margin-top: 10px;
      font-size: 20px;
    }

    .caption {
      color: purple;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <img src="logopp.png" alt="GJ Logo">
    <div><strong>GJGRAM</strong></div>
    <div class="navbar-icons">
      <a href="profile.html"><i class="fa-solid fa-circle-user"></i></a>
      <i class="fa-solid fa-gear" style="color: #00040a;"></i>
      </div>
  </div>

  <div class="menu-bar">
    <i class="fas fa-home active"></i>
    <a href="friend.html"><i class="fas fa-users"></i></a>
    <i class="fa-solid fa-paper-plane" style="color: #010409;"></i>
    <i class="fa-solid fa-bars" style="color: #000000;"></i>
  </div>

  <div class="post">
    <div class="post-header">
      <div class="profile-pic"></div>
      <div class="user-info">
        <div class="name">Damon JD</div>
        <div class="stats">
          <span style="color:red;">4k views</span>
          <span style="color:blue;">2.05k followers</span>
          <span>12min ago</span>
        </div>
        <div class="caption">My small brother...</div>
      </div>
    </div>
    <img src="w1.jpeg" alt="Post Image">
    <div class="post-actions">
      <i class="far fa-heart"></i>
      <i class="far fa-comment"></i>
      <i class="fas fa-share"></i>
    </div>
  </div>

  <div class="post">
    <div class="post-header">
      <div class="profile-pic"></div>
      <div class="user-info">
        <div class="name">Chris king pro</div>
        <div class="stats">
          <span style="color:red;">4k views</span>
          <span style="color:blue;">2.05k followers</span>
          <span>1h ago</span>
        </div>
        <div class="caption">The best vac shows...</div>
      </div>
    </div>
    <img src="user.png" alt="Post Image">
    <div class="post-actions">
      <i class="far fa-heart"></i>
      <i class="far fa-comment"></i>
      <i class="fas fa-share"></i>
    </div>
  </div>
</body>
</html>
