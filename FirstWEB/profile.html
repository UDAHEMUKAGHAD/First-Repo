<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GJGRAM</title>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .pic i{
            font-size: 250px;
            margin-left: 550px;
            margin-top: 70px;
        }
        .return i{
            font-size: xx-large;
            margin-left: 30px;
            margin-top: 10px;
        }
        .names{
            font-size: xx-large;
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
        }
        .butns .flw{
            margin-left: 15vw;
            height: 4vw;
            width: 30vw;
            border-radius: 999px;
            background-color: darkred;
            font-size: xx-large;
            color: white;
        }
        .butns .mssg{
            height: 4vw;
            width: 30vw;
            margin-left: 50vw;
            transform: translateY(-4vw);
            border-radius: 999px;
            background-color: darkred;
            font-size: xx-large;
            color: white;
        }
        .wrd span{
            font-size: 5vw;
            font-weight: bold;
            margin-left: 3vw;
        }
        .flw:hover{
            background-color: fuchsia;
        }
         .mssg:hover{
            background-color: fuchsia;
         }
    </style>
</head>
<body>
    <div class="return">
        <a href="GJ.html"><i class="fa-solid fa-less-than" style="color: #010204;"></i></a>
    </div>
    <div class="pic">
    <i class="fa-solid fa-circle-user"></i>
    </div>
    <div class="names">Damon JD</div>
    <div class="butns">
        <button class="flw">Follow<i class="fa-solid fa-plus" style="color: white;"></i></button>
        <button class="mssg">Message</button><br><br>
    </div>
    <div class="wrd"><span>Posts</span></div>
</body>
</html>
